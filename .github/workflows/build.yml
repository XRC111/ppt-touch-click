name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------- 主程序 (.NET Framework 4.8)
      - name: Compile PptTouchClick.exe
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw "csc.exe not found" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $csc /nologo /target:winexe /optimize+ /utf8output /out:dist\PptTouchClick.exe `
            /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll `
            PptTouchClick.cs Slideshow.cs Hook.cs Tray.cs TouchInjector.cs
          if ($LASTEXITCODE -ne 0) { throw "csc failed: $LASTEXITCODE" }
          Get-Item dist\PptTouchClick.exe | Format-List Name,Length

      # ---------------------------------------------------------------- 原生组件 (MSVC)
      # ---------------------------------------------------------------- 类型库（注册用；已随仓库提供，能生成时以生成结果为准）
      - name: Make type library
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $sdk = 'C:\Program Files (x86)\Microsoft SDKs\Windows\v10.0A\bin\NETFX 4.8.1 Tools'
          $tlbexp = Get-ChildItem $sdk -Recurse -Filter tlbexp.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($tlbexp) {
            & $tlbexp.FullName src\PptSlideProc.TlbGen.dll /out:dist\PptSlideProc.tlb
          }
          if (-not (Test-Path dist\PptSlideProc.tlb)) {
            Write-Host "tlbexp 不可用，使用仓库内预生成的 src\PptSlideProc.tlb"
            Copy-Item src\PptSlideProc.tlb dist\PptSlideProc.tlb
          }
          Get-Item dist\PptSlideProc.tlb | Format-List Name,Length
      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build PptSlideProc.x64.dll
        shell: cmd
        run: |
          rc /nologo /fo dist\PptSlideProc.res src\PptSlideProc.rc
          cl /nologo /O2 /EHsc /W3 /DUNICODE /D_UNICODE /LD /Fe:dist\PptSlideProc.x64.dll src\SlideWatcher.cpp dist\PptSlideProc.res oleaut32.lib ole32.lib /link /DEF:src\PptSlideProc.def
          if errorlevel 1 exit /b 1

      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build PptSlideProc.ocx
        shell: cmd
        run: |
          rc /nologo /fo dist\PptSlideProc32.res src\PptSlideProc.rc
          cl /nologo /O2 /EHsc /W3 /DUNICODE /D_UNICODE /LD /Fe:dist\PptSlideProc.ocx src\SlideWatcher.cpp dist\PptSlideProc32.res oleaut32.lib ole32.lib /link /DEF:src\PptSlideProc.def
          if errorlevel 1 exit /b 1

      # ---------------------------------------------------------------- 自检
      - name: Native self-test (PowerShell 5.1)
        shell: powershell
        run: |
          # 先手工写入每个用户的 COM 注册（regsvr32 在 CI 上偶尔不可用）
          $reg = "HKCU:\Software\Classes\CLSID\{2F4C7A19-8B63-4E21-9A6D-1C3B550E7A21}"
          New-Item -Path "$reg\InprocServer32" -Force | Out-Null
          New-ItemProperty -Path $reg -Name "(default)" -Value "PptTouchClick SlideWatcher" -PropertyType String -Force | Out-Null
          New-ItemProperty -Path "$reg\InprocServer32" -Name "(default)" -Value "$PWD\dist\PptSlideProc.x64.dll" -PropertyType String -Force | Out-Null
          New-ItemProperty -Path "$reg\InprocServer32" -Name "ThreadingModel" -Value "Both" -PropertyType String -Force | Out-Null
          New-Item -Path "HKCU:\Software\Classes\PptTouchClick.SlideWatcher\CLSID" -Force | Out-Null
          New-ItemProperty -Path "HKCU:\Software\Classes\PptTouchClick.SlideWatcher\CLSID" -Name "(default)" -Value "{2F4C7A19-8B63-4E21-9A6D-1C3B550E7A21}" -PropertyType String -Force | Out-Null

          # 再用真正的 regsvr32 走一遍（同时验证 DllRegisterServer），失败只提示不中断
          & regsvr32 /s "$PWD\dist\PptSlideProc.x64.dll" /i:user
          Write-Host "regsvr32 exit=$LASTEXITCODE"

          # ---- 深度诊断（只打印，不中断）----
          Add-Type -TypeDefinition "using System; using System.Runtime.InteropServices; public static class Nt { [DllImport(`"kernel32.dll`", CharSet=CharSet.Unicode, SetLastError=true)] public static extern IntPtr LoadLibraryW(string p); [DllImport(`"kernel32.dll`")] public static extern IntPtr GetProcAddress(IntPtr h, string n); }"
          $h = [Nt]::LoadLibraryW("$PWD\dist\PptSlideProc.x64.dll")
          "LoadLibrary=" + $h + " err=" + [Runtime.InteropServices.Marshal]::GetLastWin32Error()
          if ($h -ne [IntPtr]::Zero) {
            "DllGetClassObject=" + [Nt]::GetProcAddress($h, "DllGetClassObject")
            "DllRegisterServer=" + [Nt]::GetProcAddress($h, "DllRegisterServer")
          }
          Write-Host "regsvr32(verbose):"
          & regsvr32 /n /i:user "$PWD\dist\PptSlideProc.x64.dll"
          Get-Content "$PWD\dist\PptSlideProc.log" -ErrorAction SilentlyContinue
          # ---- 诊断结束 ----

          $type = [type]::GetTypeFromProgID("PptTouchClick.SlideWatcher", $true)
          $w = [Activator]::CreateInstance($type)
          $flags = [Reflection.BindingFlags]::InvokeMethod
          "start="  + $type.InvokeMember("Start", $flags, $null, $w, $null)
          "status=" + $type.InvokeMember("GetStatus", $flags, $null, $w, $null)
          "stop="   + $type.InvokeMember("Stop", $flags, $null, $w, $null)
          [Runtime.InteropServices.Marshal]::FinalReleaseComObject($w) | Out-Null
          Get-Content "$PWD\dist\PptSlideProc.log" -ErrorAction SilentlyContinue

          & regsvr32 /s /u "$PWD\dist\PptSlideProc.x64.dll" /i:user
          Remove-Item "HKCU:\Software\Classes\PptTouchClick.SlideWatcher" -Recurse -Force
          Remove-Item "HKCU:\Software\Classes\CLSID\{2F4C7A19-8B63-4E21-9A6D-1C3B550E7A21}" -Recurse -Force
      # ---------------------------------------------------------------- 打包
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md, install.cmd, uninstall.cmd dist\
          Compress-Archive -Path dist\* -DestinationPath PptTouchClick.zip -Force
          Get-ChildItem dist | Format-Table Name,Length
          Get-Item PptTouchClick.zip | Format-List Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: PptTouchClick
          path: PptTouchClick.zip

      # ---------------------------------------------------------------- 打 tag 时顺便发 Release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" PptTouchClick.zip --title "${{ github.ref_name }}" --notes "PptTouchClick 构建产物"