name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------- 主程序 (.NET Framework 4.8)
      - name: Compile PptTouchClick.exe
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw "csc.exe not found" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $csc /nologo /target:winexe /optimize+ /utf8output /win32manifest:app.manifest /out:dist\PptTouchClick.exe `
            /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll `
            PptTouchClick.cs Slideshow.cs Hook.cs Tray.cs TouchInjector.cs
          if ($LASTEXITCODE -ne 0) { throw "csc failed: $LASTEXITCODE" }
          Get-Item dist\PptTouchClick.exe | Format-List Name,Length

      # ---------------------------------------------------------------- 原生组件 (MSVC)
      # ---------------------------------------------------------------- 类型库（注册用；已随仓库提供，能生成时以生成结果为准）
      - name: Make type library
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $sdk = 'C:\Program Files (x86)\Microsoft SDKs\Windows\v10.0A\bin\NETFX 4.8.1 Tools'
          $tlbexp = Get-ChildItem $sdk -Recurse -Filter tlbexp.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($tlbexp) {
            & $tlbexp.FullName src\PptSlideProc.TlbGen.dll /out:dist\PptSlideProc.tlb
          }
          if (-not (Test-Path dist\PptSlideProc.tlb)) {
            Write-Host "tlbexp 不可用，使用仓库内预生成的 src\PptSlideProc.tlb"
            Copy-Item src\PptSlideProc.tlb dist\PptSlideProc.tlb
          }
          Get-Item dist\PptSlideProc.tlb | Format-List Name,Length
      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build PptSlideProc.x64.dll
        shell: cmd
        run: |
          rc /nologo /fo dist\PptSlideProc.res src\PptSlideProc.rc
          cl /nologo /O2 /EHsc /utf-8 /W3 /DUNICODE /D_UNICODE /LD /Fe:dist\PptSlideProc.x64.dll src\SlideWatcher.cpp dist\PptSlideProc.res oleaut32.lib ole32.lib /link /DEF:src\PptSlideProc.def
          if errorlevel 1 exit /b 1

      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build PptSlideProc.ocx
        shell: cmd
        run: |
          rc /nologo /fo dist\PptSlideProc32.res src\PptSlideProc.rc
          cl /nologo /O2 /EHsc /utf-8 /W3 /DUNICODE /D_UNICODE /LD /Fe:dist\PptSlideProc.ocx src\SlideWatcher.cpp dist\PptSlideProc32.res oleaut32.lib ole32.lib /link /DEF:src\PptSlideProc.def
          if errorlevel 1 exit /b 1

      # ---------------------------------------------------------------- 自检
      - name: Native self-test (PowerShell 5.1)
        shell: powershell
        run: |
          # 1) 直接调用导出的 DllGetClassObject / DllCanUnloadNow（CoreCLR 对无 TypeLib 的 IDispatch-only 组件会拒绝 CoCreate）
          Add-Type -Path "$PWD\src\ComProbe.cs"
          $probe = [ComProbe]::Run("$PWD\dist\PptSlideProc.x64.dll")
          Write-Host $probe
          if ($probe -notmatch "DllGetClassObject=0x00000000") { throw "DllGetClassObject failed: $probe" }

          # 2) 安装路径：走 regsvr32（按用户注册，DllRegisterServer 写 HKCU）
          & regsvr32 /s "$PWD\dist\PptSlideProc.x64.dll"
          Write-Host "regsvr32 exit=$LASTEXITCODE"
          $reg = "HKCU:\Software\Classes\CLSID\{2F4C7A19-8B63-4E21-9A6D-1C3B550E7A21}\InprocServer32"
          if (-not (Test-Path $reg)) { throw "COM class was not registered (regsvr32 failed)" }
          "InprocServer32=" + (Get-ItemProperty $reg).'(default)'

          # 3) 组件日志：应能看到 loaded / Start / hook
          Get-Content "$PWD\dist\PptSlideProc.log" -ErrorAction SilentlyContinue

          & regsvr32 /s /u "$PWD\dist\PptSlideProc.x64.dll"
      # ---------------------------------------------------------------- 打包
      - name: Package
        shell: pwsh
        run: |
          # 只打包运行需要的文件（去掉 .lib / .exp / .res 等链接中间产物）
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item README.md, install.cmd, uninstall.cmd stage\
          Copy-Item dist\PptTouchClick.exe, dist\PptSlideProc.x64.dll, dist\PptSlideProc.ocx, dist\PptSlideProc.tlb stage\
          Compress-Archive -Path stage\* -DestinationPath PptTouchClick.zip -Force
          Get-ChildItem stage | Format-Table Name,Length
          Get-Item PptTouchClick.zip | Format-List Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: PptTouchClick
          path: PptTouchClick.zip

      # ---------------------------------------------------------------- 每次构建成功自动发 Release（tag = v1.0.<构建号>）
      - name: Release (auto)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_NO: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          $tag = "v1.0.$env:RUN_NO"
          $short = $env:SHA.Substring(0,7)
          $notes = "自动构建 [run #$env:RUN_ID](https://github.com/$env:REPO/actions/runs/$env:RUN_ID)`n`n提交 [$short](https://github.com/$env:REPO/commit/$env:SHA)"
          # tag 不存在就建（指向本次构建的提交）；已存在时 gh 会非零退出，忽略即可
          gh api "repos/$env:REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:SHA" 2>$null | Out-Null
          gh release view $tag -R $env:REPO 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag PptTouchClick.zip -R $env:REPO --clobber
          } else {
            gh release create $tag PptTouchClick.zip -R $env:REPO --title "PptTouchClick $tag" --notes $notes
          }
          Write-Host "release: $tag"

      # ---------------------------------------------------------------- 手动打 tag 时也发 Release
      - name: Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "${{ github.ref_name }}" -R $env:REPO 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" PptTouchClick.zip -R $env:REPO --clobber
          } else {
            gh release create "${{ github.ref_name }}" PptTouchClick.zip -R $env:REPO --title "${{ github.ref_name }}" --notes "PptTouchClick 构建产物"
          }